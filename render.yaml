services:
  - type: web
    name: insight-leadership
    env: python
    plan: free
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install --only-binary=:all: fastapi==0.104.1 uvicorn==0.24.0 pydantic==2.5.0 python-multipart==0.0.6 python-dotenv==1.0.0 openai==2.16.0"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
